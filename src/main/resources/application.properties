spring.application.name=devvault

# Server
server.port=8080
spring.jpa.open-in-view=false

# Database
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:devvault}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:kush}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Cache
spring.cache.type=redis
spring.cache.redis.time-to-live=300000

# Encryption
encryption.key=${ENCRYPTION_KEY:12345678901234567890123456789012}

# Springdoc
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true