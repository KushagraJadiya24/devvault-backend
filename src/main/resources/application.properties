spring.application.name=devvault

# Server
server.port=8080
spring.jpa.open-in-view=false

# Database
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:devvault}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:kush}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Redis
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
# Cache
spring.cache.type=redis
spring.cache.redis.time-to-live=300000

# Encryption
encryption.key=${ENCRYPTION_KEY:12345678901234567890123456789012}
jwt.secret=${JWT_SECRET:mydefaultsecretkey12345678901234567890}

# Springdoc
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

springdoc.swagger-ui.url=https://devvault-backend-production-d964.up.railway.app/v3/api-docs
server.forward-headers-strategy=framework